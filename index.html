<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>港股即時看盤</title>
  <!-- 引入繁簡轉換工具 OpenCC-JS -->
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
  <style>
    /* 預設暗黑模式變數 */
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --card-bg: #2a2a2a;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #333333;
      --up-color: #00E676;   
      --down-color: #FF5252; 
      --flat-color: #AAAAAA;
      --accent: #1f538d;
      --buy-bg: rgba(0, 230, 118, 0.12);
      --sell-bg: rgba(255, 82, 82, 0.12);
    }

    /* 白天（亮色）模式變數 */
    body.light-mode {
      --bg-color: #f0f2f5;
      --panel-bg: #ffffff;
      --card-bg: #ffffff;
      --text-main: #1c1e21;
      --text-muted: #65676b;
      --border-color: #e4e6eb;
      --up-color: #00875a;   /* 深綠漲 */
      --down-color: #de350b; /* 鮮紅跌 */
      --flat-color: #65676b;
      --accent: #1f538d;
      --buy-bg: #e8f8f0;
      --sell-bg: #ffebe6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 10px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* 頂部單一行控制列 */
    .top-add-bar {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .top-add-bar button {
      padding: 8px 10px;
      border-radius: 8px;
      border: none;
      background-color: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s ease;
      flex-shrink: 0;
    }

    .top-add-bar button:hover {
      opacity: 0.9;
    }

    /* 縮窄後的輸入框 */
    .top-add-bar input {
      width: 100px;
      flex: 0 1 110px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--panel-bg);
      color: var(--text-main);
      font-size: 13px; 
    }

    .top-add-bar input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* 日夜切換按鈕專屬樣式 */
    .theme-toggle-btn {
      background-color: var(--panel-bg) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color) !important;
    }

    /* 市場狀態標籤 (最右側) */
    .status-badge {
      font-weight: bold;
      font-size: 12px;
      padding: 7px 8px;
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      white-space: nowrap;
      margin-left: auto;
      flex-shrink: 0;
    }

    /* 單行垂直佈局區域 */
    .grid-container {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: 1fr; 
      gap: 8px;
    }

    /* 個別報價卡片 */
    .stock-panel {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: center;
      user-select: none;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, background-color 0.2s ease;
    }

    .stock-panel.dragging {
      opacity: 0.3;
    }

    /* ===== 價格變動閃爍動畫 ===== */
    @keyframes flashGreen {
      0% { background-color: rgba(0, 230, 118, 0.35); }
      100% { background-color: var(--panel-bg); }
    }

    @keyframes flashRed {
      0% { background-color: rgba(255, 82, 82, 0.35); }
      100% { background-color: var(--panel-bg); }
    }

    .flash-up {
      animation: flashGreen 0.8s ease-out;
    }

    .flash-down {
      animation: flashRed 0.8s ease-out;
    }

    /* 卡片頂部 */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .header-left {
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    /* 專屬拖曳握把 (⋮⋮) */
    .drag-handle {
      cursor: grab;
      color: var(--text-muted);
      font-weight: bold;
      font-size: 16px;
      padding: 0 8px 0 0;
      user-select: none;
      touch-action: none;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    /* 股票名稱 */
    .title {
      font-size: 15px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .remove-btn {
      background-color: transparent;
      color: var(--down-color);
      border: 1px solid var(--down-color);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 所有數據放在同一行的滾動區塊 */
    .data-scroll-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      white-space: nowrap;
      overflow-x: auto;
      width: 100%;
      padding-bottom: 2px;
    }
    
    .data-scroll-row::-webkit-scrollbar {
      display: none; 
    }

    .price {
      font-size: 20px;
      font-weight: bold;
    }

    .change {
      font-size: 14px;
      font-weight: bold;
      margin-right: 6px;
    }

    .info-item {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ===== 第一檔盤口區塊（寬度 350px） ===== */
    .depth-panel {
      display: none;
      margin: 8px 0 2px 0;
      width: 100%;
      max-width: 350px;
      padding-top: 6px;
      border-top: 1px dashed var(--border-color);
    }

    .stock-panel.expanded .depth-panel {
      display: block;
    }

    .depth-title-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .depth-bar-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .buy-pct-text {
      font-size: 12px;
      font-weight: bold;
      color: var(--up-color);
      min-width: 42px;
    }

    .sell-pct-text {
      font-size: 12px;
      font-weight: bold;
      color: var(--down-color);
      min-width: 42px;
      text-align: right;
    }

    .depth-bar-bg {
      flex: 1;
      height: 5px;
      background-color: var(--border-color);
      border-radius: 2px;
      overflow: hidden;
      display: flex;
    }

    .buy-bar-fill {
      height: 100%;
      background-color: var(--up-color);
      width: 50%;
      transition: width 0.3s ease;
    }

    .sell-bar-fill {
      height: 100%;
      background-color: var(--down-color);
      width: 50%;
      transition: width 0.3s ease;
    }

    .depth-box-row {
      display: flex;
      gap: 6px;
    }

    .depth-box {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 10px;
      border-radius: 6px;
    }

    .buy-box {
      background-color: var(--buy-bg);
    }

    .sell-box {
      background-color: var(--sell-bg);
    }

    /* 買賣盤股價字體調大至 18px */
    .depth-price {
      font-size: 18px;
      font-weight: bold;
    }

    .depth-vol {
      font-size: 12px;
      font-weight: bold;
      color: var(--text-main);
    }

  </style>
</head>
<body>

  <!-- 最頂層單一行：日/夜 > 新增 > 輸入欄 > 狀態 -->
  <div class="top-add-bar">
    <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()">☀️ 日</button>
    <button onclick="addStock()">新增</button>
    <input type="text" id="newStockInput" placeholder="代號 (如:0700)">
    <span id="marketStatusBadge" class="status-badge">載入中...</span>
  </div>

  <!-- 卡片列表區域 -->
  <div class="grid-container" id="gridContainer"></div>

  <script>
    let s2hk = (text) => text; 
    try {
      if (typeof OpenCC !== 'undefined') {
        s2hk = OpenCC.Converter({ from: 'cn', to: 'hk' });
      }
    } catch (e) {
      console.warn("繁簡轉換庫載入失敗");
    }

    /* ================= 主題切換 (日 / 夜) ================= */
    const THEME_STORAGE_KEY = 'hk_stock_theme_preference';

    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
        updateThemeBtnText(true);
      } else {
        document.body.classList.remove('light-mode');
        updateThemeBtnText(false);
      }
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-mode');
      localStorage.setItem(THEME_STORAGE_KEY, isLight ? 'light' : 'dark');
      updateThemeBtnText(isLight);
    }

    function updateThemeBtnText(isLight) {
      const btn = document.getElementById('themeToggleBtn');
      if (btn) {
        btn.innerHTML = isLight ? '🌙 夜' : '☀️ 日';
      }
    }

    /* ================= 防止螢幕休眠 ================= */
    let wakeLock = null;
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {}
      }
    }
    requestWakeLock();
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') await requestWakeLock();
    });

    /* ================= 本地記憶功能 (localStorage) ================= */
    const STORAGE_KEY = 'hk_stock_watchlist_user_data';
    let nextId = 0;

    function loadStockList() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed.map(symbol => ({ id: nextId++, symbol: symbol }));
          }
        } catch (e) {}
      }
      return [
        { id: nextId++, symbol: "HSI" },
        { id: nextId++, symbol: "00753" },
        { id: nextId++, symbol: "01800" },
        { id: nextId++, symbol: "02333" }
      ];
    }

    function saveStockList() {
      const symbols = stockList.map(item => item.symbol);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(symbols));
    }

    let stockList = loadStockList();
    let timerId = null;

    document.getElementById('newStockInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') addStock();
    });

    /* ================= 卡片點擊展開/收折控制 ================= */
    function toggleCardExpand(id, event) {
      if (event.target.closest('.remove-btn') || event.target.closest('.drag-handle')) {
        return;
      }
      const card = document.getElementById(`panel-${id}`);
      if (card) {
        card.classList.toggle('expanded');
      }
    }

    function createCardHtml(item) {
      return `
        <div class="stock-panel" id="panel-${item.id}" onclick="toggleCardExpand(${item.id}, event)">
          <div class="card-header">
            <div class="header-left">
              <span class="drag-handle" title="拖動排序">⋮⋮</span>
              <div class="title" id="title-${item.id}">載入中...</div>
            </div>
            <button class="remove-btn" onclick="removeStock(${item.id})" draggable="false">✕</button>
          </div>
          <div class="data-scroll-row">
            <span class="price" id="price-${item.id}">0.000</span>
            <span class="change" id="change-${item.id}">+0.000 (+0.00%)</span>
            <span class="info-item" id="high-${item.id}">最高: --</span>
            <span class="info-item" id="low-${item.id}">最低: --</span>
            <span class="info-item" id="vol-${item.id}">成交: --</span>
            <span class="info-item" id="time-${item.id}">更新: --</span>
          </div>

          <!-- 第一檔買賣盤區塊 -->
          <div class="depth-panel" id="depth-${item.id}">
            <div class="depth-title-row">
              <span>買盤</span>
              <span>賣盤</span>
            </div>
            <div class="depth-bar-container">
              <span class="buy-pct-text" id="buy-pct-${item.id}">50.00%</span>
              <div class="depth-bar-bg">
                <div class="buy-bar-fill" id="buy-bar-${item.id}" style="width: 50%;"></div>
                <div class="sell-bar-fill" id="sell-bar-${item.id}" style="width: 50%;"></div>
              </div>
              <span class="sell-pct-text" id="sell-pct-${item.id}">50.00%</span>
            </div>
            <div class="depth-box-row">
              <div class="depth-box buy-box">
                <span class="depth-price" id="bid-price-${item.id}">--</span>
                <span class="depth-vol" id="bid-vol-${item.id}">--</span>
              </div>
              <div class="depth-box sell-box">
                <span class="depth-price" id="ask-price-${item.id}">--</span>
                <span class="depth-vol" id="ask-vol-${item.id}">--</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderGridUI() {
      const container = document.getElementById("gridContainer");
      container.innerHTML = stockList.map(item => createCardHtml(item)).join("");
    }

    /* ================= 拖拽排序邏輯 ================= */
    function initDragAndDrop() {
      const container = document.getElementById("gridContainer");

      container.addEventListener("mousedown", (e) => {
        const card = e.target.closest(".stock-panel");
        if (!card) return;

        if (e.target.closest(".drag-handle")) {
          card.setAttribute("draggable", "true");
        } else {
          card.setAttribute("draggable", "false");
        }
      });

      container.addEventListener("dragstart", (e) => {
        const card = e.target.closest(".stock-panel");
        if (!card || card.getAttribute("draggable") !== "true") {
          e.preventDefault();
          return;
        }
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
      });

      container.addEventListener("dragend", (e) => {
        const card = e.target.closest(".stock-panel");
        if (!card) return;
        card.classList.remove("dragging");
        card.setAttribute("draggable", "false");
        syncStockListOrder();
      });

      container.addEventListener("dragover", (e) => {
        e.preventDefault();
        const dragging = container.querySelector(".dragging");
        if (!dragging) return;

        const afterElement = getDragAfterElement(container, e.clientY);
        if (afterElement == null) {
          container.appendChild(dragging);
        } else {
          container.insertBefore(dragging, afterElement);
        }
      });

      let touchedCard = null;

      container.addEventListener("touchstart", (e) => {
        if (!e.target.closest(".drag-handle")) return; 

        const card = e.target.closest(".stock-panel");
        if (!card) return;

        touchedCard = card;
        touchedCard.classList.add("dragging");
      }, { passive: true });

      container.addEventListener("touchmove", (e) => {
        if (!touchedCard) return;
        const touch = e.touches[0];
        const afterElement = getDragAfterElement(container, touch.clientY);
        if (afterElement == null) {
          container.appendChild(touchedCard);
        } else {
          container.insertBefore(touchedCard, afterElement);
        }
      }, { passive: true });

      container.addEventListener("touchend", () => {
        if (!touchedCard) return;
        touchedCard.classList.remove("dragging");
        touchedCard = null;
        syncStockListOrder();
      });
    }

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('.stock-panel:not(.dragging)')];

      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function syncStockListOrder() {
      const container = document.getElementById("gridContainer");
      const cards = container.querySelectorAll(".stock-panel");
      const newStockList = [];

      cards.forEach(card => {
        const id = parseInt(card.id.replace("panel-", ""), 10);
        const item = stockList.find(s => s.id === id);
        if (item) newStockList.push(item);
      });

      stockList = newStockList;
      saveStockList();
    }

    /* ================= 股票資料讀取與增刪邏輯 ================= */
    function addStock() {
      const inputEl = document.getElementById('newStockInput');
      const val = inputEl.value.trim();
      if (val) {
        const newItem = { id: nextId++, symbol: val };
        stockList.push(newItem);
        saveStockList();

        inputEl.value = "";

        const container = document.getElementById("gridContainer");
        container.insertAdjacentHTML('beforeend', createCardHtml(newItem));

        updateAllStocks();
      }
    }

    function removeStock(id) {
      stockList = stockList.filter(item => item.id !== id);
      saveStockList();
      
      const card = document.getElementById(`panel-${id}`);
      if (card) card.remove();
    }

    /* ================= 港股交易狀態判定 ================= */
    function updateMarketStatus() {
      const hkDateString = new Date().toLocaleString('en-US', { timeZone: 'Asia/Hong_Kong' });
      const now = new Date(hkDateString);
      const day = now.getDay();
      const statusBadge = document.getElementById("marketStatusBadge");

      if (day === 0 || day === 6) {
        if (statusBadge) statusBadge.innerText = "⚪ 非交易日";
        return false;
      }

      const hours = now.getHours();
      const minutes = now.getMinutes();
      const timeInMinutes = hours * 60 + minutes;

      const mStart = 9 * 60;       
      const mEnd = 12 * 60;        
      const aStart = 13 * 60;      
      const aEnd = 16 * 60 + 10;   

      let isTrading = false;
      let statusText = "🔴 已收市";

      if ((timeInMinutes >= mStart && timeInMinutes < mEnd) || (timeInMinutes >= aStart && timeInMinutes <= aEnd)) {
        statusText = "🟢 盤中交易";
        isTrading = true;
      } else if (timeInMinutes >= mEnd && timeInMinutes < aStart) {
        statusText = "🟡 午休";
        isTrading = false;
      } else {
        statusText = "🔴 已收市";
        isTrading = false;
      }

      if (statusBadge) statusBadge.innerText = statusText;
      return isTrading;
    }

    function formatVolDisplay(vol) {
      if (isNaN(vol) || vol === 0) return "0";
      if (vol >= 1e6) return (vol / 1e6).toFixed(1) + 'M';
      if (vol >= 1e3) return (vol / 1e3).toFixed(0) + 'K';
      return vol.toString();
    }

    /* ================= 批次請求 (Batch API Request) 核心邏輯 ================= */
    function updateAllStocks() {
      if (timerId) {
        clearTimeout(timerId);
        timerId = null;
      }

      const isTrading = updateMarketStatus();

      if (stockList.length === 0) {
        scheduleNextUpdate(isTrading);
        return;
      }

      const queryParts = [];
      const itemVarMap = new Map();

      stockList.forEach(item => {
        const symbol = item.symbol.trim();
        const isIndex = symbol.toUpperCase() === 'HSI' || symbol.toUpperCase() === 'HKHSI';
        let param, varName;

        if (isIndex) {
          param = 's_hkHSI';
          varName = 'v_s_hkHSI';
        } else {
          const cleanCode = symbol.toUpperCase().replace('.HK', '').trim().padStart(5, '0');
          param = `r_hk${cleanCode}`;
          varName = `v_r_hk${cleanCode}`;
        }

        queryParts.push(param);
        itemVarMap.set(item.id, varName);
      });

      const uniqueParams = [...new Set(queryParts)].join(',');
      const url = `https://qt.gtimg.cn/q=${uniqueParams}`;

      const scriptId = `batch-jsonp-script`;
      const oldScript = document.getElementById(scriptId);
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = scriptId;
      script.src = url;

      script.onload = () => {
        stockList.forEach(item => {
          const varName = itemVarMap.get(item.id);
          const dataStr = window[varName];
          parseAndRenderStock(item, dataStr);
        });

        scheduleNextUpdate(isTrading);
      };

      script.onerror = () => {
        scheduleNextUpdate(isTrading);
      };

      document.body.appendChild(script);
    }

    function scheduleNextUpdate(isTrading) {
      if (isTrading) {
        timerId = setTimeout(updateAllStocks, 1000); 
      } else {
        timerId = setTimeout(updateAllStocks, 60000); 
      }
    }

    /* ================= 解析數據與第一檔盤口渲染 ================= */
    function parseAndRenderStock(item, dataStr) {
      const titleEl = document.getElementById(`title-${item.id}`);
      if (!titleEl) return; 

      if (dataStr && dataStr.includes('~')) {
        const parts = dataStr.split('~');
        const stockName = s2hk(parts[1]); 
        const symbol = item.symbol.trim();
        const isIndex = symbol.toUpperCase() === 'HSI' || symbol.toUpperCase() === 'HKHSI';

        if (isIndex && parts.length > 5) {
          const price = parseFloat(parts[3]);
          const change = parseFloat(parts[4]);
          const changePct = parseFloat(parts[5]);
          const turnover = parseFloat(parts[6]) || 0.0;

          titleEl.innerText = `${stockName} (${parts[2]})`;
          const priceEl = document.getElementById(`price-${item.id}`);
          const changeEl = document.getElementById(`change-${item.id}`);
          
          priceEl.innerText = price.toFixed(2);

          let color = 'var(--flat-color)';
          let prefix = '';
          if (change > 0) {
            color = 'var(--up-color)';
            prefix = '▲ +';
          } else if (change < 0) {
            color = 'var(--down-color)';
            prefix = '▼ ';
          }

          priceEl.style.color = color;
          changeEl.style.color = color;
          changeEl.innerText = `${prefix}${change.toFixed(2)} (${changePct > 0 ? '+' : ''}${changePct.toFixed(2)}%)`;

          document.getElementById(`high-${item.id}`).innerText = `最高: --`;
          document.getElementById(`low-${item.id}`).innerText = `最低: --`;
          document.getElementById(`vol-${item.id}`).innerText = `大市成交: ${(turnover / 1e8).toFixed(2)} 億`;
          
          const timeString = new Date().toLocaleTimeString('zh-HK', { hour12: false });
          document.getElementById(`time-${item.id}`).innerText = `更新: ${timeString}`;

          const depthEl = document.getElementById(`depth-${item.id}`);
          if (depthEl) depthEl.style.display = 'none';

          triggerPriceFlash(item, price);
          return;
        } else if (!isIndex && parts.length > 34 && parts[1] !== '') {
          const price = parseFloat(parts[3]);
          const prevClose = parseFloat(parts[4]);
          const change = parts[31] ? parseFloat(parts[31]) : (price - prevClose);
          const changePct = parts[32] ? parseFloat(parts[32]) : 0.0;
          const high = parseFloat(parts[33]) || 0.0;
          const low = parseFloat(parts[34]) || 0.0;
          const volume = parts[6] ? parseFloat(parts[6]) : 0.0;
          
          let updateTime = parts[30] || new Date().toLocaleTimeString('zh-HK', { hour12: false });
          if(updateTime.length > 8 && updateTime.includes(" ")) {
              updateTime = updateTime.split(" ")[1]; 
          }

          titleEl.innerText = `${stockName} (${parts[2]}.HK)`;
          const priceEl = document.getElementById(`price-${item.id}`);
          const changeEl = document.getElementById(`change-${item.id}`);
          
          priceEl.innerText = price.toFixed(3);

          let color = 'var(--flat-color)';
          let prefix = '';
          if (change > 0) {
            color = 'var(--up-color)';
            prefix = '▲ +';
          } else if (change < 0) {
            color = 'var(--down-color)';
            prefix = '▼ ';
          }

          priceEl.style.color = color;
          changeEl.style.color = color;
          changeEl.innerText = `${prefix}${change.toFixed(3)} (${changePct > 0 ? '+' : ''}${changePct.toFixed(2)}%)`;

          document.getElementById(`high-${item.id}`).innerText = `最高: ${high.toFixed(3)}`;
          document.getElementById(`low-${item.id}`).innerText = `最低: ${low.toFixed(3)}`;

          let volStr = '';
          if (volume >= 1e8) {
            volStr = `${(volume / 1e8).toFixed(2)} 億`;
          } else if (volume >= 1e4) {
            volStr = `${(volume / 1e4).toFixed(2)} 萬`;
          } else {
            volStr = `${Math.floor(volume)}`;
          }
          document.getElementById(`vol-${item.id}`).innerText = `成交: ${volStr}`;
          document.getElementById(`time-${item.id}`).innerText = `更新: ${updateTime}`;

          /* ===== 第一檔買賣盤 ===== */
          const bidPrice = parseFloat(parts[9]) || price;
          const bidVol = parseInt(parts[10], 10) || 0;
          const askPrice = parseFloat(parts[11]) || price;
          const askVol = parseInt(parts[12], 10) || 0;

          const totalDepthVol = bidVol + askVol;
          let buyRatio = 50.0;
          let sellRatio = 50.0;

          if (totalDepthVol > 0) {
            buyRatio = (bidVol / totalDepthVol) * 100;
            sellRatio = (askVol / totalDepthVol) * 100;
          }

          const bidPriceEl = document.getElementById(`bid-price-${item.id}`);
          const askPriceEl = document.getElementById(`ask-price-${item.id}`);

          bidPriceEl.innerText = bidPrice.toFixed(3);
          askPriceEl.innerText = askPrice.toFixed(3);

          bidPriceEl.style.color = color;
          askPriceEl.style.color = color;

          document.getElementById(`bid-vol-${item.id}`).innerText = formatVolDisplay(bidVol);
          document.getElementById(`ask-vol-${item.id}`).innerText = formatVolDisplay(askVol);

          document.getElementById(`buy-pct-${item.id}`).innerText = `${buyRatio.toFixed(2)}%`;
          document.getElementById(`sell-pct-${item.id}`).innerText = `${sellRatio.toFixed(2)}%`;

          document.getElementById(`buy-bar-${item.id}`).style.width = `${buyRatio.toFixed(2)}%`;
          document.getElementById(`sell-bar-${item.id}`).style.width = `${sellRatio.toFixed(2)}%`;

          triggerPriceFlash(item, price);
          return;
        }
      }
      titleEl.innerText = "查無此代號";
    }

    /* 檢查股價變動並觸發紅綠閃爍動畫 */
    function triggerPriceFlash(item, newPrice) {
      const cardEl = document.getElementById(`panel-${item.id}`);
      if (!cardEl) return;

      if (item.lastPrice !== undefined && item.lastPrice !== null) {
        if (newPrice > item.lastPrice) {
          cardEl.classList.remove('flash-up', 'flash-down');
          void cardEl.offsetWidth; 
          cardEl.classList.add('flash-up');
        } else if (newPrice < item.lastPrice) {
          cardEl.classList.remove('flash-up', 'flash-down');
          void cardEl.offsetWidth; 
          cardEl.classList.add('flash-down');
        }
      }
      item.lastPrice = newPrice;
    }

    // 初始化網頁
    initTheme();
    renderGridUI();
    initDragAndDrop();
    updateAllStocks();
  </script>
</body>
</html>
