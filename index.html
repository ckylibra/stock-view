<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>港股及原油即時看盤</title>

  <!-- PWA & 全螢幕獨立 App 標籤 (iOS / Android) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="港股看盤">
  <meta name="theme-color" id="themeColorMeta" content="#121212">

  <!-- App 圖示 -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- 引入繁簡轉換工具 OpenCC-JS -->
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
  <style>
    /* 預設暗黑模式變數 */
    :root {
      --font-scale: 1; /* 動態字體縮放比例 */
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --card-bg: #2a2a2a;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #333333;
      --up-color: #00E676;   
      --down-color: #FF5252; 
      --flat-color: #AAAAAA;
      --accent: #1f538d;
      --buy-bg: rgba(0, 230, 118, 0.12);
      --sell-bg: rgba(255, 82, 82, 0.12);
    }

    /* 白天（亮色）模式變數 */
    body.light-mode {
      --bg-color: #f0f2f5;
      --panel-bg: #ffffff;
      --card-bg: #ffffff;
      --text-main: #1c1e21;
      --text-muted: #65676b;
      --border-color: #e4e6eb;
      --up-color: #00875a;   /* 深綠漲 */
      --down-color: #de350b; /* 鮮紅跌 */
      --flat-color: #65676b;
      --accent: #1f538d;
      --buy-bg: #e8f8f0;
      --sell-bg: #ffebe6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 10px;
      padding-top: max(10px, env(safe-area-inset-top)); /* 適應 iPhone 劉海屏 / 動態島 */
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* 當開啟天氣列時，增加 Body 底部預留邊距，避免阻擋最後一張股票卡片 */
    body.has-weather-bar {
      padding-bottom: max(50px, calc(40px + env(safe-area-inset-bottom)));
    }

    /* 頂部單一行控制列 */
    .top-add-bar {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .top-add-bar button {
      padding: 8px 10px;
      border-radius: 8px;
      border: none;
      background-color: var(--accent);
      color: #fff;
      font-size: calc(13px * var(--font-scale));
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s ease, opacity 0.2s ease;
      flex-shrink: 0;
    }

    .top-add-bar button:hover {
      opacity: 0.9;
    }

    /* 縮窄後的輸入框 */
    .top-add-bar input {
      width: 130px;
      flex: 0 1 130px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--panel-bg);
      color: var(--text-main);
      font-size: calc(13px * var(--font-scale)); 
    }

    .top-add-bar input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* 日夜切換及字體/天氣按鈕專屬樣式 */
    .theme-toggle-btn {
      background-color: var(--panel-bg) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color) !important;
    }

    .theme-toggle-btn.active {
      border-color: var(--accent) !important;
    }

    /* 市場狀態標籤 */
    .status-badge {
      font-weight: bold;
      font-size: calc(12px * var(--font-scale));
      padding: 7px 8px;
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      white-space: nowrap;
      margin-left: auto;
      flex-shrink: 0;
    }

    /* 單行垂直佈局區域 */
    .grid-container {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: 1fr; 
      gap: 8px;
    }

    /* 個別報價卡片 */
    .stock-panel {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: center;
      user-select: none;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, background-color 0.2s ease;
    }

    .stock-panel.dragging {
      opacity: 0.3;
    }

    /* ===== 全卡片價格變動閃爍動畫 ===== */
    @keyframes flashGreen {
      0% { background-color: rgba(0, 230, 118, 0.35); }
      100% { background-color: var(--panel-bg); }
    }

    @keyframes flashRed {
      0% { background-color: rgba(255, 82, 82, 0.35); }
      100% { background-color: var(--panel-bg); }
    }

    .flash-up {
      animation: flashGreen 1.0s ease-out;
    }

    .flash-down {
      animation: flashRed 1.0s ease-out;
    }

    /* ===== 買賣盤區域變動閃爍動畫 ===== */
    @keyframes flashBuyBg {
      0% { background-color: rgba(0, 230, 118, 0.6); }
      100% { background-color: var(--buy-bg); }
    }

    @keyframes flashSellBg {
      0% { background-color: rgba(255, 82, 82, 0.6); }
      100% { background-color: var(--sell-bg); }
    }

    .flash-buy {
      animation: flashBuyBg 0.8s ease-out;
    }

    .flash-sell {
      animation: flashSellBg 0.8s ease-out;
    }

    /* 卡片頂部 */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .header-left {
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    /* 專屬拖曳握把 (⋮⋮) */
    .drag-handle {
      cursor: grab;
      color: var(--text-muted);
      font-weight: bold;
      font-size: calc(16px * var(--font-scale));
      padding: 0 8px 0 0;
      user-select: none;
      touch-action: none;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    /* 股票名稱 */
    .title {
      font-size: calc(15px * var(--font-scale));
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .remove-btn {
      background-color: transparent;
      color: var(--down-color);
      border: 1px solid var(--down-color);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: calc(11px * var(--font-scale));
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 所有數據放在同一行的滾動區塊 */
    .data-scroll-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      white-space: nowrap;
      overflow-x: auto;
      width: 100%;
      padding-bottom: 2px;
    }
    
    .data-scroll-row::-webkit-scrollbar {
      display: none; 
    }

    .price {
      font-size: calc(20px * var(--font-scale));
      font-weight: bold;
    }

    .change {
      font-size: calc(14px * var(--font-scale));
      font-weight: bold;
      margin-right: 6px;
    }

    .info-item {
      font-size: calc(12px * var(--font-scale));
      color: var(--text-muted);
    }

    /* ===== 第一檔盤口區塊（寬度 350px） ===== */
    .depth-panel {
      display: none;
      margin: 8px 0 2px 0;
      width: 100%;
      max-width: 350px;
      padding-top: 6px;
      border-top: 1px dashed var(--border-color);
    }

    .stock-panel.expanded .depth-panel {
      display: block;
    }

    .depth-title-row {
      display: flex;
      justify-content: space-between;
      font-size: calc(12px * var(--font-scale));
      font-weight: bold;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .depth-bar-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .buy-pct-text {
      font-size: calc(12px * var(--font-scale));
      font-weight: bold;
      color: var(--up-color);
      min-width: 42px;
    }

    .sell-pct-text {
      font-size: calc(12px * var(--font-scale));
      font-weight: bold;
      color: var(--down-color);
      min-width: 42px;
      text-align: right;
    }

    .depth-bar-bg {
      flex: 1;
      height: 5px;
      background-color: var(--border-color);
      border-radius: 2px;
      overflow: hidden;
      display: flex;
    }

    .buy-bar-fill {
      height: 100%;
      background-color: var(--up-color);
      width: 50%;
      transition: width 0.3s ease;
    }

    .sell-bar-fill {
      height: 100%;
      background-color: var(--down-color);
      width: 50%;
      transition: width 0.3s ease;
    }

    .depth-box-row {
      display: flex;
      gap: 6px;
    }

    .depth-box {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 10px;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }

    .buy-box {
      background-color: var(--buy-bg);
    }

    .sell-box {
      background-color: var(--sell-bg);
    }

    .depth-price {
      font-size: calc(18px * var(--font-scale));
      font-weight: bold;
    }

    .depth-vol {
      font-size: calc(12px * var(--font-scale));
      font-weight: bold;
      color: var(--text-main);
    }

    /* ===== 固定於手機螢幕最底部的跑馬燈天氣預報列 ===== */
    .weather-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: calc(12.5px * var(--font-scale));
      padding: 8px 0;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      z-index: 9999;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      white-space: nowrap;
    }

    /* 走馬燈文字慢速滾動動畫 (80 秒平緩移動) */
    .weather-content {
      display: inline-block;
      white-space: nowrap;
      padding-left: 100vw;
      animation: marqueeScroll 80s linear infinite;
      will-change: transform;
    }

    @keyframes marqueeScroll {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-100%);
      }
    }

  </style>
</head>
<body>

  <!-- 最頂層單一行：新增 > 輸入欄 > 狀態 > A- > A+ > 🌤️ 天氣 > ☀️/🌙 (最右邊) -->
  <div class="top-add-bar">
    <button onclick="addStock()">新增</button>
    <input type="text" id="newStockInput" placeholder="代號 (如:0700, WTI, BRENT)">
    <span id="marketStatusBadge" class="status-badge">載入中...</span>
    <button class="theme-toggle-btn" onclick="changeFontSize(-1)" title="縮小字體">A-</button>
    <button class="theme-toggle-btn" onclick="changeFontSize(1)" title="放大字體">A+</button>
    <button id="weatherToggleBtn" class="theme-toggle-btn" onclick="toggleWeather()" title="天氣預報開關">🌤️</button>
    <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()">☀️</button>
  </div>

  <!-- 卡片列表區域 -->
  <div class="grid-container" id="gridContainer"></div>

  <!-- 固定於手機螢幕底部的天氣跑馬燈列 -->
  <div id="weatherBar" class="weather-bar" style="display: none;">
    <div id="weatherContent" class="weather-content">🌤️ 天氣資料載入中...</div>
  </div>

  <script>
    let s2hk = (text) => text; 
    try {
      if (typeof OpenCC !== 'undefined') {
        s2hk = OpenCC.Converter({ from: 'cn', to: 'hk' });
      }
    } catch (e) {
      console.warn("繁簡轉換庫載入失敗");
    }

    /* ================= 效能優化：DOM Diffing 輔助函數 ================= */
    function updateTextIfChanged(el, newText) {
      if (el && el.textContent !== newText) {
        el.textContent = newText;
      }
    }

    function updateStyleIfChanged(el, property, newValue) {
      if (el && el.style[property] !== newValue) {
        el.style[property] = newValue;
      }
    }

    /* ================= PWA 動態 Manifest 與 Service Worker 初始化 ================= */
    function initPWA() {
      const manifestObj = {
        name: "港股及原油即時看盤",
        short_name: "港股看盤",
        description: "高效能港股與原油期貨即時看盤工具",
        start_url: "./",
        display: "standalone",
        orientation: "portrait",
        background_color: "#121212",
        theme_color: "#121212",
        icons: [
          {
            src: "icon-192.png",
            sizes: "192x192",
            type: "image/png",
            purpose: "any maskable"
          },
          {
            src: "icon-512.png",
            sizes: "512x512",
            type: "image/png",
            purpose: "any maskable"
          }
        ]
      };

      const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
      const manifestURL = URL.createObjectURL(manifestBlob);
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = manifestURL;
      document.head.appendChild(manifestLink);

      if ('serviceWorker' in navigator) {
        const swCode = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => self.clients.claim());
          self.addEventListener('fetch', (e) => {
            if (e.request.method === 'GET') {
              e.respondWith(
                fetch(e.request).catch(() => caches.match(e.request))
              );
            }
          });
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swURL = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swURL).catch(() => {});
      }
    }

    /* ================= 天氣預報功能 (香港天文台 API & 本地記憶) ================= */
    const WEATHER_STORAGE_KEY = 'hk_stock_weather_preference';
    let weatherTimer = null;

    function initWeather() {
      const savedWeather = localStorage.getItem(WEATHER_STORAGE_KEY);
      const isEnabled = savedWeather === 'true'; 
      applyWeatherState(isEnabled);
    }

    function toggleWeather() {
      const weatherBar = document.getElementById('weatherBar');
      const isCurrentlyEnabled = weatherBar && weatherBar.style.display !== 'none';
      const newState = !isCurrentlyEnabled;

      localStorage.setItem(WEATHER_STORAGE_KEY, newState.toString());
      applyWeatherState(newState);
    }

    function applyWeatherState(isEnabled) {
      const weatherBar = document.getElementById('weatherBar');
      const toggleBtn = document.getElementById('weatherToggleBtn');

      if (isEnabled) {
        if (weatherBar) weatherBar.style.display = 'block';
        document.body.classList.add('has-weather-bar');
        if (toggleBtn) {
          toggleBtn.classList.add('active');
          toggleBtn.style.opacity = '1';
        }
        fetchWeather();
        if (!weatherTimer) {
          weatherTimer = setInterval(fetchWeather, 600000); 
        }
      } else {
        if (weatherBar) weatherBar.style.display = 'none';
        document.body.classList.remove('has-weather-bar');
        if (toggleBtn) {
          toggleBtn.classList.remove('active');
          toggleBtn.style.opacity = '0.5';
        }
        if (weatherTimer) {
          clearInterval(weatherTimer);
          weatherTimer = null;
        }
      }
    }

    async function fetchWeather() {
      const weatherBar = document.getElementById('weatherBar');
      const weatherContent = document.getElementById('weatherContent');
      if (!weatherBar || weatherBar.style.display === 'none') return;

      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();

        let temp = '--';
        if (data.temperature && data.temperature.data && data.temperature.data.length > 0) {
          const hkoTemp = data.temperature.data.find(item => item.place === '香港天文台');
          temp = hkoTemp ? hkoTemp.value : data.temperature.data[0].value;
        }

        let humidity = '--';
        if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
          humidity = data.humidity.data[0].value;
        }

        let warningText = '';
        if (data.warningMessage && data.warningMessage.length > 0) {
          warningText = ` ⚠️ ${data.warningMessage.join(' ｜ ')}`;
        }

        const updateTime = data.updateTime ? data.updateTime.substring(11, 16) : '';

        const weatherText = `📍 香港即時天氣 (${updateTime}) ｜ 🌡️ 氣溫 ${temp}°C ｜ 💧 濕度 ${humidity}%${warningText}`;
        if (weatherContent) updateTextIfChanged(weatherContent, weatherText);
      } catch (e) {
        if (weatherContent) updateTextIfChanged(weatherContent, '🌤️ 天氣資料更新失敗，稍後重新嘗試');
      }
    }

    /* ================= 文字大小控制與本地記憶 ================= */
    const FONT_STORAGE_KEY = 'hk_stock_font_scale_preference';
    let currentFontScale = 1.0;

    function initFontSize() {
      const savedScale = localStorage.getItem(FONT_STORAGE_KEY);
      if (savedScale) {
        const parsed = parseFloat(savedScale);
        if (!isNaN(parsed)) {
          currentFontScale = parsed;
        }
      }
      applyFontSize();
    }

    function changeFontSize(delta) {
      currentFontScale = Math.round((currentFontScale + delta * 0.1) * 10) / 10;
      if (currentFontScale < 0.7) currentFontScale = 0.7;
      if (currentFontScale > 1.5) currentFontScale = 1.5;

      localStorage.setItem(FONT_STORAGE_KEY, currentFontScale.toString());
      applyFontSize();
    }

    function applyFontSize() {
      document.documentElement.style.setProperty('--font-scale', currentFontScale);
    }

    /* ================= 港股最低上落價位 (Minimum Tick Size) 對照表 ================= */
    function getTickSize(price) {
      if (price <= 0.25) return 0.001;
      if (price <= 10.00) return 0.005;
      if (price <= 20.00) return 0.010;
      if (price <= 50.00) return 0.020;
      if (price <= 100.00) return 0.050;
      if (price <= 200.00) return 0.100;
      if (price <= 500.00) return 0.200;
      if (price <= 1000.00) return 0.500;
      if (price <= 2000.00) return 1.000;
      if (price <= 5000.00) return 2.000;
      if (price <= 9995.00) return 5.000;
      return 10.000;
    }

    /* 隨機生成 2K (2,000) 至 990K (990,000) 之間的數量 */
    function getRandomVol() {
      const minK = 2;
      const maxK = 990;
      const randomK = Math.floor(Math.random() * (maxK - minK + 1)) + minK;
      return randomK * 1000;
    }

    /* 觸發區塊閃爍動畫工具 */
    function triggerBoxFlash(el, className) {
      if (!el) return;
      el.classList.remove(className);
      void el.offsetWidth;
      el.classList.add(className);
    }

    /* ================= 主題切換 (日 / 夜 & PWA 狀態列顏色同步) ================= */
    const THEME_STORAGE_KEY = 'hk_stock_theme_preference';

    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
        updateThemeBtnText(true);
      } else {
        document.body.classList.remove('light-mode');
        updateThemeBtnText(false);
      }
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-mode');
      localStorage.setItem(THEME_STORAGE_KEY, isLight ? 'light' : 'dark');
      updateThemeBtnText(isLight);
    }

    function updateThemeBtnText(isLight) {
      const btn = document.getElementById('themeToggleBtn');
      if (btn) {
        updateTextIfChanged(btn, isLight ? '🌙' : '☀️');
      }

      const themeColorMeta = document.getElementById('themeColorMeta');
      if (themeColorMeta) {
        themeColorMeta.setAttribute('content', isLight ? '#f0f2f5' : '#121212');
      }
    }

    /* ================= 防止螢幕休眠 ================= */
    let wakeLock = null;
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {}
      }
    }
    requestWakeLock();
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') await requestWakeLock();
    });

    /* ================= 本地記憶功能 (localStorage) ================= */
    const STORAGE_KEY = 'hk_stock_watchlist_user_data';
    let nextId = 0;

    function loadStockList() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed.map(symbol => ({ id: nextId++, symbol: symbol }));
          }
        } catch (e) {}
      }
      return [
        { id: nextId++, symbol: "HSI" },
        { id: nextId++, symbol: "WTI" },
        { id: nextId++, symbol: "BRENT" },
        { id: nextId++, symbol: "00753" },
        { id: nextId++, symbol: "01800" }
      ];
    }

    function saveStockList() {
      const symbols = stockList.map(item => item.symbol);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(symbols));
    }

    let stockList = loadStockList();
    let timerId = null;

    document.getElementById('newStockInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') addStock();
    });

    /* ================= 卡片點擊展開/收折控制 ================= */
    function toggleCardExpand(id, event) {
      if (event.target.closest('.remove-btn') || event.target.closest('.drag-handle')) {
        return;
      }
      const card = document.getElementById(`panel-${id}`);
      if (card) {
        card.classList.toggle('expanded');
      }
    }

    function renderGridUI() {
      const container = document.getElementById("gridContainer");
      container.innerHTML = stockList.map(item => createCardHtml(item)).join("");
    }

    /* ================= 拖拽排序邏輯 ================= */
    function initDragAndDrop() {
      const container = document.getElementById("gridContainer");

      container.addEventListener("mousedown", (e) => {
        const card = e.target.closest(".stock-panel");
        if (!card) return;

        if (e.target.closest(".drag-handle")) {
          card.setAttribute("draggable", "true");
        } else {
          card.setAttribute("draggable", "false");
        }
      });

      container.addEventListener("dragstart", (e) => {
        const card = e.target.closest(".stock-panel");
        if (!card || card.getAttribute("draggable") !== "true") {
          e.preventDefault();
          return;
        }
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
      });

      container.addEventListener("dragend", (e) => {
        const card = e.target.closest(".stock-panel");
        if (!card) return;
        card.classList.remove("dragging");
        card.setAttribute("draggable", "false");
        syncStockListOrder();
      });

      container.addEventListener("dragover", (e) => {
        e.preventDefault();
        const dragging = container.querySelector(".dragging");
        if (!dragging) return;

        const afterElement = getDragAfterElement(container, e.clientY);
        if (afterElement == null) {
          container.appendChild(dragging);
        } else {
          container.insertBefore(dragging, afterElement);
        }
      });

      let touchedCard = null;

      container.addEventListener("touchstart", (e) => {
        if (!e.target.closest(".drag-handle")) return; 

        const card = e.target.closest(".stock-panel");
        if (!card) return;

        touchedCard = card;
        touchedCard.classList.add("dragging");
      }, { passive: true });

      container.addEventListener("touchmove", (e) => {
        if (!touchedCard) return;
        const touch = e.touches[0];
        const afterElement = getDragAfterElement(container, touch.clientY);
        if (afterElement == null) {
          container.appendChild(touchedCard);
        } else {
          container.insertBefore(touchedCard, afterElement);
        }
      }, { passive: true });

      container.addEventListener("touchend", () => {
        if (!touchedCard) return;
        touchedCard.classList.remove("dragging");
        touchedCard = null;
        syncStockListOrder();
      });
    }

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('.stock-panel:not(.dragging)')];

      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function syncStockListOrder() {
      const container = document.getElementById("gridContainer");
      const cards = container.querySelectorAll(".stock-panel");
      const newStockList = [];

      cards.forEach(card => {
        const id = parseInt(card.id.replace("panel-", ""), 10);
        const item = stockList.find(s => s.id === id);
        if (item) newStockList.push(item);
      });

      stockList = newStockList;
      saveStockList();
    }

    /* ================= 股票資料讀取與增刪邏輯 ================= */
    function addStock() {
      const inputEl = document.getElementById('newStockInput');
      const val = inputEl.value.trim();
      if (val) {
        const newItem = { id: nextId++, symbol: val };
        stockList.push(newItem);
        saveStockList();

        inputEl.value = "";

        const container = document.getElementById("gridContainer");
        container.insertAdjacentHTML('beforeend', createCardHtml(newItem));

        updateAllStocks();
      }
    }

    function removeStock(id) {
      stockList = stockList.filter(item => item.id !== id);
      saveStockList();
      
      const card = document.getElementById(`panel-${id}`);
      if (card) card.remove();
    }

    /* ================= 港股交易狀態判定 ================= */
    function updateMarketStatus() {
      const hkDateString = new Date().toLocaleString('en-US', { timeZone: 'Asia/Hong_Kong' });
      const now = new Date(hkDateString);
      const day = now.getDay();
      const statusBadge = document.getElementById("marketStatusBadge");

      let statusText = "🔴 已收市";
      let isTrading = false;
      let isAuction = false;

      if (day === 0 || day === 6) {
        statusText = "⚪ 非交易日";
      } else {
        const hours = now.getHours();
        const minutes = now.getMinutes();
        const timeInMinutes = hours * 60 + minutes;

        if (timeInMinutes >= 9 * 60 && timeInMinutes < 9 * 60 + 20) {
          statusText = "🟡 開市競價";
          isTrading = true;
          isAuction = true;
        } 
        else if (timeInMinutes >= 9 * 60 + 20 && timeInMinutes < 9 * 60 + 30) {
          statusText = "🟡 競價暫停";
        }
        else if (timeInMinutes >= 9 * 60 + 30 && timeInMinutes < 12 * 60) {
          statusText = "🟢 盤中交易";
          isTrading = true;
        }
        else if (timeInMinutes >= 12 * 60 && timeInMinutes < 13 * 60) {
          statusText = "🟡 午休";
        }
        else if (timeInMinutes >= 13 * 60 && timeInMinutes < 16 * 60) {
          statusText = "🟢 盤中交易";
          isTrading = true;
        }
        else if (timeInMinutes >= 16 * 60 && timeInMinutes < 16 * 60 + 10) {
          statusText = "🟡 收市競價";
          isTrading = true;
          isAuction = true;
        } 
      }

      if (statusBadge) updateTextIfChanged(statusBadge, statusText);
      return { isTrading, isAuction };
    }

    function formatVolDisplay(vol) {
      if (isNaN(vol) || vol === 0) return "0";
      if (vol >= 1e6) return (vol / 1e6).toFixed(1) + 'M';
      if (vol >= 1e3) return (vol / 1e3).toFixed(0) + 'K';
      return vol.toString();
    }

    /* ================= 批次請求 (Batch API Request) 核心邏輯 ================= */
    function updateAllStocks() {
      if (timerId) {
        clearTimeout(timerId);
        timerId = null;
      }

      const market = updateMarketStatus();
      const isTrading = market.isTrading;

      if (stockList.length === 0) {
        scheduleNextUpdate(isTrading);
        return;
      }

      const queryParts = [];
      const itemVarMap = new Map();

      stockList.forEach(item => {
        const symbol = item.symbol.trim().toUpperCase();
        let param, varName;

        if (symbol === 'HSI' || symbol === 'HKHSI') {
          param = 's_hkHSI';
          varName = 'v_s_hkHSI';
        } else if (['WTI', 'CL', 'HF_CL'].includes(symbol)) {
          param = 'hf_CL';
          varName = 'v_hf_CL';
        } else if (['BRENT', 'OIL', 'BZ', 'HF_OIL'].includes(symbol)) {
          param = 'hf_OIL';
          varName = 'v_hf_OIL';
        } else {
          const cleanCode = symbol.replace('.HK', '').trim().padStart(5, '0');
          param = `r_hk${cleanCode}`;
          varName = `v_r_hk${cleanCode}`;
        }

        queryParts.push(param);
        itemVarMap.set(item.id, varName);
      });

      const uniqueParams = [...new Set(queryParts)].join(',');
      const url = `https://qt.gtimg.cn/q=${uniqueParams}`;

      const scriptId = `batch-jsonp-script`;
      const oldScript = document.getElementById(scriptId);
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = scriptId;
      script.src = url;

      script.onload = () => {
        stockList.forEach(item => {
          const varName = itemVarMap.get(item.id);
          const dataStr = window[varName];
          parseAndRenderStock(item, dataStr);
        });

        scheduleNextUpdate(true);
      };

      script.onerror = () => {
        scheduleNextUpdate(isTrading);
      };

      document.body.appendChild(script);
    }

    function scheduleNextUpdate(isTrading) {
      if (isTrading) {
        timerId = setTimeout(updateAllStocks, 1000); 
      } else {
        timerId = setTimeout(updateAllStocks, 10000); 
      }
    }

    function getPriceColor(price, prevClose) {
      if (!prevClose || price === 0) return 'var(--text-main)';
      if (price > prevClose) return 'var(--up-color)';
      if (price < prevClose) return 'var(--down-color)';
      return 'var(--flat-color)';
    }

    /* ================= 買賣盤數據快取 (收市/休市記憶) ================= */
    const DEPTH_CACHE_KEY = 'hk_stock_depth_cache';

    function saveDepthCache() {
      const cache = {};
      stockList.forEach(item => {
        if (item.bidVol && item.askVol) {
          cache[item.symbol] = {
            bidVol: item.bidVol,
            askVol: item.askVol,
            bidPrice: item.bidPrice,
            askPrice: item.askPrice
          };
        }
      });
      localStorage.setItem(DEPTH_CACHE_KEY, JSON.stringify(cache));
    }

    function applyDepthCache(item) {
      if (item.bidVol && item.askVol) return;
      const saved = localStorage.getItem(DEPTH_CACHE_KEY);
      if (saved) {
        try {
          const cache = JSON.parse(saved);
          if (cache[item.symbol]) {
            item.bidVol = cache[item.symbol].bidVol;
            item.askVol = cache[item.symbol].askVol;
            if (cache[item.symbol].bidPrice) item.bidPrice = cache[item.symbol].bidPrice;
            if (cache[item.symbol].askPrice) item.askPrice = cache[item.symbol].askPrice;
          }
        } catch(e) {}
      }
    }

    /* ================= 第一檔買賣盤渲染與動態閃爍邏輯 (Diffing 優化) ================= */
    function renderDepthPanel(item) {
      const bidPriceEl = document.getElementById(`bid-price-${item.id}`);
      const askPriceEl = document.getElementById(`ask-price-${item.id}`);
      if (!bidPriceEl || !askPriceEl) return;

      const market = updateMarketStatus();
      const now = Date.now();
      let buyChanged = false;
      let sellChanged = false;

      if (market.isTrading) {
        if (!item.lastVolUpdate || (now - item.lastVolUpdate >= (item.nextVolDelay || 1000))) {
          if (!item.bidVol || !item.askVol) {
            item.bidVol = getRandomVol();
            item.askVol = getRandomVol();
            buyChanged = true;
            sellChanged = true;
          } else {
            const mode = Math.floor(Math.random() * 3);
            if (mode === 0) {
              item.bidVol = getRandomVol();
              buyChanged = true;
            } else if (mode === 1) {
              item.askVol = getRandomVol();
              sellChanged = true;
            } else {
              item.bidVol = getRandomVol();
              item.askVol = getRandomVol();
              buyChanged = true;
              sellChanged = true;
            }
          }

          item.lastVolUpdate = now;
          item.nextVolDelay = Math.floor(Math.random() * 19000) + 1000;

          saveDepthCache();

          const buyBoxEl = document.getElementById(`buy-box-${item.id}`);
          const sellBoxEl = document.getElementById(`sell-box-${item.id}`);

          if (buyChanged && buyBoxEl) triggerBoxFlash(buyBoxEl, 'flash-buy');
          if (sellChanged && sellBoxEl) triggerBoxFlash(sellBoxEl, 'flash-sell');
        }
      } 
      else {
        applyDepthCache(item);

        if (!item.bidVol || !item.askVol) {
          item.bidVol = getRandomVol();
          item.askVol = getRandomVol();
          saveDepthCache();
        }
      }

      const bidPrice = item.bidPrice || 0;
      const askPrice = item.askPrice || 0;
      const prevClose = item.prevClose || 0;
      const bidVol = item.bidVol || 20000;
      const askVol = item.askVol || 20000;

      const totalDepthVol = bidVol + askVol;
      let buyRatio = 50.0;
      let sellRatio = 50.0;

      if (totalDepthVol > 0) {
        buyRatio = (bidVol / totalDepthVol) * 100;
        sellRatio = (askVol / totalDepthVol) * 100;
      }

      updateTextIfChanged(bidPriceEl, bidPrice.toFixed(3));
      updateTextIfChanged(askPriceEl, askPrice.toFixed(3));
      updateStyleIfChanged(bidPriceEl, 'color', getPriceColor(bidPrice, prevClose));
      updateStyleIfChanged(askPriceEl, 'color', getPriceColor(askPrice, prevClose));

      const bidVolEl = document.getElementById(`bid-vol-${item.id}`);
      const askVolEl = document.getElementById(`ask-vol-${item.id}`);
      const buyPctEl = document.getElementById(`buy-pct-${item.id}`);
      const sellPctEl = document.getElementById(`sell-pct-${item.id}`);
      const buyBarEl = document.getElementById(`buy-bar-${item.id}`);
      const sellBarEl = document.getElementById(`sell-bar-${item.id}`);

      const buyRatioStr = `${buyRatio.toFixed(2)}%`;
      const sellRatioStr = `${sellRatio.toFixed(2)}%`;

      updateTextIfChanged(bidVolEl, formatVolDisplay(bidVol));
      updateTextIfChanged(askVolEl, formatVolDisplay(askVol));
      updateTextIfChanged(buyPctEl, buyRatioStr);
      updateTextIfChanged(sellPctEl, sellRatioStr);

      updateStyleIfChanged(buyBarEl, 'width', buyRatioStr);
      updateStyleIfChanged(sellBarEl, 'width', sellRatioStr);
    }

    setInterval(() => {
      stockList.forEach(item => {
        if (item.bidPrice && item.askPrice) {
          renderDepthPanel(item);
        }
      });
    }, 500);

    /* ================= 解析股票與原油期貨數據 (Diffing 優化) ================= */
    function parseAndRenderStock(item, dataStr) {
      const titleEl = document.getElementById(`title-${item.id}`);
      if (!titleEl) return; 

      const symbol = item.symbol.trim().toUpperCase();
      const isIndex = symbol === 'HSI' || symbol === 'HKHSI';
      const isOil = ['WTI', 'CL', 'HF_CL', 'BRENT', 'OIL', 'BZ', 'HF_OIL'].includes(symbol);

      if (isOil && dataStr) {
        const parts = dataStr.split(',');
        if (parts.length >= 8) {
          const price = parseFloat(parts[0]);
          const change = parseFloat(parts[1]);
          const prevClose = parseFloat(parts[7]);
          const high = parseFloat(parts[4]);
          const low = parseFloat(parts[5]);
          const updateTime = parts[6] || new Date().toLocaleTimeString('zh-HK', { hour12: false });
          const changePct = prevClose ? ((change / prevClose) * 100) : 0;
          
          let stockName = parts[13] ? s2hk(parts[13]) : '';
          if (!stockName) {
            stockName = (symbol.includes('WTI') || symbol.includes('CL')) ? 'WTI原油期貨' : '布倫特原油期貨';
          }

          updateTextIfChanged(titleEl, `${stockName} (${symbol})`);
          
          const priceEl = document.getElementById(`price-${item.id}`);
          const changeEl = document.getElementById(`change-${item.id}`);
          updateTextIfChanged(priceEl, price.toFixed(2));

          let color = 'var(--flat-color)';
          let prefix = '';
          if (change > 0) {
            color = 'var(--up-color)';
            prefix = '▲ +';
          } else if (change < 0) {
            color = 'var(--down-color)';
            prefix = '▼ ';
          }

          updateStyleIfChanged(priceEl, 'color', color);
          updateStyleIfChanged(changeEl, 'color', color);
          updateTextIfChanged(changeEl, `${prefix}${change.toFixed(2)}\u00A0\u00A0\u00A0(${changePct > 0 ? '+' : ''}${changePct.toFixed(2)}%)`);

          updateTextIfChanged(document.getElementById(`high-${item.id}`), `最高: ${high.toFixed(2)}`);
          updateTextIfChanged(document.getElementById(`low-${item.id}`), `最低: ${low.toFixed(2)}`);
          updateTextIfChanged(document.getElementById(`vol-${item.id}`), `成交: --`);
          updateTextIfChanged(document.getElementById(`time-${item.id}`), `更新: ${updateTime}`);

          const depthEl = document.getElementById(`depth-${item.id}`);
          if (depthEl) updateStyleIfChanged(depthEl, 'display', 'none');

          triggerPriceFlash(item, price);
          return;
        }
      }

      if (dataStr && dataStr.includes('~')) {
        const parts = dataStr.split('~');
        const stockName = s2hk(parts[1]); 

        if (isIndex && parts.length > 5) {
          const price = parseFloat(parts[3]);
          const change = parseFloat(parts[4]);
          const changePct = parseFloat(parts[5]);
          const turnover = parseFloat(parts[6]) || 0.0;

          updateTextIfChanged(titleEl, `${stockName} (${parts[2]})`);
          const priceEl = document.getElementById(`price-${item.id}`);
          const changeEl = document.getElementById(`change-${item.id}`);
          
          updateTextIfChanged(priceEl, price.toFixed(2));

          let color = 'var(--flat-color)';
          let prefix = '';
          if (change > 0) {
            color = 'var(--up-color)';
            prefix = '▲ +';
          } else if (change < 0) {
            color = 'var(--down-color)';
            prefix = '▼ ';
          }

          updateStyleIfChanged(priceEl, 'color', color);
          updateStyleIfChanged(changeEl, 'color', color);
          updateTextIfChanged(changeEl, `${prefix}${change.toFixed(2)}\u00A0\u00A0\u00A0(${changePct > 0 ? '+' : ''}${changePct.toFixed(2)}%)`);

          updateTextIfChanged(document.getElementById(`high-${item.id}`), `最高: --`);
          updateTextIfChanged(document.getElementById(`low-${item.id}`), `最低: --`);
          updateTextIfChanged(document.getElementById(`vol-${item.id}`), `大市成交: ${(turnover / 1e8).toFixed(2)} 億`);
          
          const timeString = new Date().toLocaleTimeString('zh-HK', { hour12: false });
          updateTextIfChanged(document.getElementById(`time-${item.id}`), `更新: ${timeString}`);

          const depthEl = document.getElementById(`depth-${item.id}`);
          if (depthEl) updateStyleIfChanged(depthEl, 'display', 'none');

          triggerPriceFlash(item, price);
          return;
        } else if (!isIndex && parts.length > 34 && parts[1] !== '') {
          const price = parseFloat(parts[3]);
          const prevClose = parseFloat(parts[4]);
          const change = parts[31] ? parseFloat(parts[31]) : (price - prevClose);
          const changePct = parts[32] ? parseFloat(parts[32]) : 0.0;
          const high = parseFloat(parts[33]) || 0.0;
          const low = parseFloat(parts[34]) || 0.0;
          const volume = parts[6] ? parseFloat(parts[6]) : 0.0;
          
          let updateTime = parts[30] || new Date().toLocaleTimeString('zh-HK', { hour12: false });
          if(updateTime.length > 8 && updateTime.includes(" ")) {
              updateTime = updateTime.split(" ")[1]; 
          }

          updateTextIfChanged(titleEl, `${stockName} (${parts[2]}.HK)`);
          const priceEl = document.getElementById(`price-${item.id}`);
          const changeEl = document.getElementById(`change-${item.id}`);
          
          updateTextIfChanged(priceEl, price.toFixed(3));

          let color = 'var(--flat-color)';
          let prefix = '';
          if (change > 0) {
            color = 'var(--up-color)';
            prefix = '▲ +';
          } else if (change < 0) {
            color = 'var(--down-color)';
            prefix = '▼ ';
          }

          updateStyleIfChanged(priceEl, 'color', color);
          updateStyleIfChanged(changeEl, 'color', color);
          updateTextIfChanged(changeEl, `${prefix}${change.toFixed(3)}\u00A0\u00A0\u00A0(${changePct > 0 ? '+' : ''}${changePct.toFixed(2)}%)`);

          updateTextIfChanged(document.getElementById(`high-${item.id}`), `最高: ${high.toFixed(3)}`);
          updateTextIfChanged(document.getElementById(`low-${item.id}`), `最低: ${low.toFixed(3)}`);

          let volStr = '';
          if (volume >= 1e8) {
            volStr = `${(volume / 1e8).toFixed(2)} 億`;
          } else if (volume >= 1e4) {
            volStr = `${(volume / 1e4).toFixed(2)} 萬`;
          } else {
            volStr = `${Math.floor(volume)}`;
          }
          updateTextIfChanged(document.getElementById(`vol-${item.id}`), `成交: ${volStr}`);
          updateTextIfChanged(document.getElementById(`time-${item.id}`), `更新: ${updateTime}`);

          let bidPrice = parseFloat(parts[9]) || 0;
          let askPrice = parseFloat(parts[11]) || 0;
          const tickSize = getTickSize(price);
          
          const market = updateMarketStatus();

          if (market.isAuction) {
            bidPrice = price;
            askPrice = price;
          } else {
            if (bidPrice <= 0 || askPrice <= 0 || bidPrice >= askPrice) {
              bidPrice = price;
              askPrice = parseFloat((price + tickSize).toFixed(3));
            }
          }

          item.bidPrice = bidPrice;
          item.askPrice = askPrice;
          item.prevClose = prevClose;

          const depthEl = document.getElementById(`depth-${item.id}`);
          if (depthEl) updateStyleIfChanged(depthEl, 'display', '');

          renderDepthPanel(item);

          triggerPriceFlash(item, price);
          return;
        }
      }
      updateTextIfChanged(titleEl, "查無此代號");
    }

    function triggerPriceFlash(item, newPrice) {
      const cardEl = document.getElementById(`panel-${item.id}`);
      if (!cardEl) return;

      if (item.lastPrice !== undefined && item.lastPrice !== null) {
        if (newPrice > item.lastPrice) {
          cardEl.classList.remove('flash-up', 'flash-down');
          void cardEl.offsetWidth; 
          cardEl.classList.add('flash-up');
        } else if (newPrice < item.lastPrice) {
          cardEl.classList.remove('flash-up', 'flash-down');
          void cardEl.offsetWidth; 
          cardEl.classList.add('flash-down');
        }
      }
      item.lastPrice = newPrice;
    }

    // 初始化 PWA、主題、字體、天氣與網頁列表
    initPWA();
    initTheme();
    initFontSize();
    initWeather();
    renderGridUI();
    initDragAndDrop();
    updateAllStocks();
  </script>
</body>
</html>
