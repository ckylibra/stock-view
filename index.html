<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>港股即時看盤</title>
  <!-- 引入繁簡轉換工具 OpenCC-JS -->
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --card-bg: #2a2a2a;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --up-color: #00E676;   
      --down-color: #FF5252; 
      --flat-color: #AAAAAA;
      --accent: #1f538d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頂部統一新增區塊 */
    .top-add-bar {
      width: 100%;
      max-width: 960px;
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .top-add-bar input {
      flex: 1;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #444;
      background-color: var(--panel-bg);
      color: #fff;
      font-size: 16px; 
    }

    .top-add-bar input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .top-add-bar button {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background-color: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .top-add-bar button:hover {
      background-color: #14375e;
    }

    /* 單行垂直佈局區域 */
    .grid-container {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: 1fr; 
      gap: 12px;
    }

    /* 個別報價卡片 */
    .stock-panel {
      background-color: var(--panel-bg);
      border-radius: 12px;
      padding: 12px 15px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      cursor: grab;
      user-select: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .stock-panel:active {
      cursor: grabbing;
    }

    /* 拖動中的卡片樣式 */
    .stock-panel.dragging {
      opacity: 0.3;
    }

    /* 卡片頂部 (標題左、移除按鈕右) */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .remove-btn {
      background-color: transparent;
      color: var(--down-color);
      border: 1px solid var(--down-color);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 所有數據放在同一行的滾動區塊 */
    .data-scroll-row {
      display: flex;
      align-items: baseline;
      gap: 14px;
      white-space: nowrap;
      overflow-x: auto;
      width: 100%;
      padding-bottom: 4px;
      cursor: default;
    }
    
    /* 隱藏滾動條保持美觀 */
    .data-scroll-row::-webkit-scrollbar {
      display: none; 
    }

    .price {
      font-size: 26px;
      font-weight: bold;
    }

    .change {
      font-size: 15px;
      font-weight: bold;
      margin-right: 8px;
    }

    .info-item {
      font-size: 13px;
      color: var(--text-muted);
    }

  </style>
</head>
<body>

  <!-- 統一在最頂，可以輸入及新增 -->
  <div class="top-add-bar">
    <input type="text" id="newStockInput" placeholder="輸入代號 (如: HSI 或 0700)">
    <button onclick="addStock()">新增</button>
  </div>

  <!-- 卡片列表區域 -->
  <div class="grid-container" id="gridContainer"></div>

  <script>
    // 初始化簡轉繁轉換器 (從簡體 cn 轉到香港繁體 hk)
    let s2hk = (text) => text; 
    try {
      if (typeof OpenCC !== 'undefined') {
        s2hk = OpenCC.Converter({ from: 'cn', to: 'hk' });
      }
    } catch (e) {
      console.warn("繁簡轉換庫載入失敗");
    }

    /* ================= 本地記憶功能 (localStorage) ================= */
    const STORAGE_KEY = 'hk_stock_watchlist_user_data';
    let nextId = 0;

    // 讀取手機本地儲存的股票代號清單
    function loadStockList() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed.map(symbol => ({ id: nextId++, symbol: symbol }));
          }
        } catch (e) {
          console.warn("讀取歷史紀錄失敗，恢復使用預設列表", e);
        }
      }
      // 首次開啟網頁時的預設股票列表
      return [
        { id: nextId++, symbol: "HSI" },
        { id: nextId++, symbol: "00753" },
        { id: nextId++, symbol: "01800" },
        { id: nextId++, symbol: "02333" }
      ];
    }

    // 將目前的股票代號與排序寫入手機本地記憶
    function saveStockList() {
      const symbols = stockList.map(item => item.symbol);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(symbols));
    }

    let stockList = loadStockList();
    let timerId = null;

    // 監聽 Enter 鍵直接新增
    document.getElementById('newStockInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        addStock();
      }
    });

    // 生成單個卡片 HTML 模版
    function createCardHtml(item) {
      return `
        <div class="stock-panel" id="panel-${item.id}" draggable="true">
          <div class="card-header">
            <div class="title" id="title-${item.id}">載入中...</div>
            <button class="remove-btn" onclick="removeStock(${item.id})" draggable="false">✕</button>
          </div>
          <div class="data-scroll-row">
            <span class="price" id="price-${item.id}">0.000</span>
            <span class="change" id="change-${item.id}">+0.000 (+0.00%)</span>
            <span class="info-item" id="high-${item.id}">最高: --</span>
            <span class="info-item" id="low-${item.id}">最低: --</span>
            <span class="info-item" id="vol-${item.id}">成交: --</span>
            <span class="info-item" id="time-${item.id}">更新: --</span>
          </div>
        </div>
      `;
    }

    // 初始化渲染列表
    function renderGridUI() {
      const container = document.getElementById("gridContainer");
      container.innerHTML = stockList.map(item => createCardHtml(item)).join("");
    }

    /* ================= 拖拽排序核心邏輯 ================= */
    function initDragAndDrop() {
      const container = document.getElementById("gridContainer");

      // 1. 電腦端 Drag & Drop API
      container.addEventListener("dragstart", (e) => {
        const card = e.target.closest(".stock-panel");
        if (!card) return;
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
      });

      container.addEventListener("dragend", (e) => {
        const card = e.target.closest(".stock-panel");
        if (!card) return;
        card.classList.remove("dragging");
        syncStockListOrder();
      });

      container.addEventListener("dragover", (e) => {
        e.preventDefault();
        const dragging = container.querySelector(".dragging");
        if (!dragging) return;

        const afterElement = getDragAfterElement(container, e.clientY);
        if (afterElement == null) {
          container.appendChild(dragging);
        } else {
          container.insertBefore(dragging, afterElement);
        }
      });

      // 2. 行動端 Touch 觸控滑動支援
      let touchedCard = null;

      container.addEventListener("touchstart", (e) => {
        if (e.target.closest(".remove-btn") || e.target.closest(".data-scroll-row")) return;

        const card = e.target.closest(".stock-panel");
        if (!card) return;

        touchedCard = card;
        touchedCard.classList.add("dragging");
      }, { passive: true });

      container.addEventListener("touchmove", (e) => {
        if (!touchedCard) return;
        const touch = e.touches[0];
        const afterElement = getDragAfterElement(container, touch.clientY);
        if (afterElement == null) {
          container.appendChild(touchedCard);
        } else {
          container.insertBefore(touchedCard, afterElement);
        }
      }, { passive: true });

      container.addEventListener("touchend", () => {
        if (!touchedCard) return;
        touchedCard.classList.remove("dragging");
        touchedCard = null;
        syncStockListOrder();
      });
    }

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('.stock-panel:not(.dragging)')];

      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function syncStockListOrder() {
      const container = document.getElementById("gridContainer");
      const cards = container.querySelectorAll(".stock-panel");
      const newStockList = [];

      cards.forEach(card => {
        const id = parseInt(card.id.replace("panel-", ""), 10);
        const item = stockList.find(s => s.id === id);
        if (item) newStockList.push(item);
      });

      stockList = newStockList;
      saveStockList(); // <-- 同步排序後儲存到本地記憶
    }

    /* ================= 股票資料讀取與增刪邏輯 ================= */
    function addStock() {
      const inputEl = document.getElementById('newStockInput');
      const val = inputEl.value.trim();
      if (val) {
        const newItem = { id: nextId++, symbol: val };
        stockList.push(newItem);
        saveStockList(); // <-- 新增後儲存到本地記憶

        inputEl.value = "";

        // 局部插入 DOM，避免整體重繪導致閃爍
        const container = document.getElementById("gridContainer");
        container.insertAdjacentHTML('beforeend', createCardHtml(newItem));

        // 僅單獨請求新股票的數據
        fetchAndRenderSlot(newItem);
      }
    }

    function removeStock(id) {
      stockList = stockList.filter(item => item.id !== id);
      saveStockList(); // <-- 刪除後儲存到本地記憶
      
      // 直接移除該 DOM 節點，無須整體刷新
      const card = document.getElementById(`panel-${id}`);
      if (card) card.remove();

      const script = document.getElementById(`jsonp-script-${id}`);
      if (script) script.remove();
    }

    function isHKEXTradingTime() {
      const hkDateString = new Date().toLocaleString('en-US', { timeZone: 'Asia/Hong_Kong' });
      const now = new Date(hkDateString);
      
      const day = now.getDay();
      if (day === 0 || day === 6) return false;

      const hours = now.getHours();
      const minutes = now.getMinutes();
      const timeInMinutes = hours * 60 + minutes;

      const mStart = 9 * 60;       // 09:00
      const mEnd = 12 * 60;        // 12:00
      const aStart = 13 * 60;      // 13:00
      const aEnd = 16 * 60 + 10;   // 16:10

      return (timeInMinutes >= mStart && timeInMinutes <= mEnd) ||
             (timeInMinutes >= aStart && timeInMinutes <= aEnd);
    }

    function fetchAndRenderSlot(item) {
      const symbol = item.symbol.trim();
      const isIndex = symbol.toUpperCase() === 'HSI' || symbol.toUpperCase() === 'HKHSI';

      let url, varName;
      if (isIndex) {
        url = `https://qt.gtimg.cn/q=s_hkHSI`;
        varName = `v_s_hkHSI`;
      } else {
        const cleanCode = symbol.toUpperCase().replace('.HK', '').trim().padStart(5, '0');
        url = `https://qt.gtimg.cn/q=r_hk${cleanCode}`;
        varName = `v_r_hk${cleanCode}`;
      }

      const scriptId = `jsonp-script-${item.id}`;
      const oldScript = document.getElementById(scriptId);
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = scriptId;
      script.src = url;

      script.onload = () => {
        const titleEl = document.getElementById(`title-${item.id}`);
        if (!titleEl) return; 

        const dataStr = window[varName];
        if (dataStr && dataStr.includes('~')) {
          const parts = dataStr.split('~');
          const stockName = s2hk(parts[1]); 

          if (isIndex) {
            if (parts.length > 5) {
              const price = parseFloat(parts[3]);
              const change = parseFloat(parts[4]);
              const changePct = parseFloat(parts[5]);
              const turnover = parseFloat(parts[6]) || 0.0;

              titleEl.innerText = `${stockName} (${parts[2]})`;
              const priceEl = document.getElementById(`price-${item.id}`);
              const changeEl = document.getElementById(`change-${item.id}`);
              
              priceEl.innerText = price.toFixed(2);

              let color = 'var(--flat-color)';
              let prefix = '';
              if (change > 0) {
                color = 'var(--up-color)';
                prefix = '▲ +';
              } else if (change < 0) {
                color = 'var(--down-color)';
                prefix = '▼ ';
              }

              priceEl.style.color = color;
              changeEl.style.color = color;
              changeEl.innerText = `${prefix}${change.toFixed(2)} (${changePct > 0 ? '+' : ''}${changePct.toFixed(2)}%)`;

              document.getElementById(`high-${item.id}`).innerText = `最高: --`;
              document.getElementById(`low-${item.id}`).innerText = `最低: --`;
              document.getElementById(`vol-${item.id}`).innerText = `大市成交: ${(turnover / 1e8).toFixed(2)} 億`;
              
              const timeString = new Date().toLocaleTimeString('zh-HK', { hour12: false });
              document.getElementById(`time-${item.id}`).innerText = `更新: ${timeString}`;
              return;
            }
          } else {
            if (parts.length > 34 && parts[1] !== '') {
              const price = parseFloat(parts[3]);
              const prevClose = parseFloat(parts[4]);
              const change = parts[31] ? parseFloat(parts[31]) : (price - prevClose);
              const changePct = parts[32] ? parseFloat(parts[32]) : 0.0;
              const high = parseFloat(parts[33]) || 0.0;
              const low = parseFloat(parts[34]) || 0.0;
              const volume = parts[6] ? parseFloat(parts[6]) : 0.0;
              
              let updateTime = parts[30] || new Date().toLocaleTimeString('zh-HK', { hour12: false });
              if(updateTime.length > 8 && updateTime.includes(" ")) {
                  updateTime = updateTime.split(" ")[1]; 
              }

              titleEl.innerText = `${stockName} (${parts[2]}.HK)`;
              const priceEl = document.getElementById(`price-${item.id}`);
              const changeEl = document.getElementById(`change-${item.id}`);
              
              priceEl.innerText = price.toFixed(3);

              let color = 'var(--flat-color)';
              let prefix = '';
              if (change > 0) {
                color = 'var(--up-color)';
                prefix = '▲ +';
              } else if (change < 0) {
                color = 'var(--down-color)';
                prefix = '▼ ';
              }

              priceEl.style.color = color;
              changeEl.style.color = color;
              changeEl.innerText = `${prefix}${change.toFixed(3)} (${changePct > 0 ? '+' : ''}${changePct.toFixed(2)}%)`;

              document.getElementById(`high-${item.id}`).innerText = `最高: ${high.toFixed(3)}`;
              document.getElementById(`low-${item.id}`).innerText = `最低: ${low.toFixed(3)}`;

              let volStr = '';
              if (volume >= 1e8) {
                volStr = `${(volume / 1e8).toFixed(2)} 億`;
              } else if (volume >= 1e4) {
                volStr = `${(volume / 1e4).toFixed(2)} 萬`;
              } else {
                volStr = `${Math.floor(volume)}`;
              }
              document.getElementById(`vol-${item.id}`).innerText = `成交: ${volStr}`;
              document.getElementById(`time-${item.id}`).innerText = `更新: ${updateTime}`;
              return;
            }
          }
        }
        titleEl.innerText = "查無此代號";
      };

      document.body.appendChild(script);
    }

    function updateAllStocks() {
      if (timerId) {
        clearTimeout(timerId);
        timerId = null;
      }

      stockList.forEach(item => {
        fetchAndRenderSlot(item);
      });

      if (isHKEXTradingTime()) {
        timerId = setTimeout(updateAllStocks, 1000);
      } else {
        timerId = setTimeout(updateAllStocks, 180000); 
      }
    }

    renderGridUI();
    initDragAndDrop();
    updateAllStocks();
  </script>
</body>
</html>
